[project]
name = "strategist-agent"
version = "1.0.0"
description = "Стратег Фабрики продуктов — ИИ-агент для продуктовой и коммуникационной стратегии"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["pyyaml>=6.0", "requests>=2.31", "beautifulsoup4>=4.12", "pypdf>=4.0", "python-docx>=1.1",
  "openpyxl>=3.1", "xlrd>=2.0.1", "pandas>=2.1", "tabulate>=0.9", "markdown>=3.5", "rich>=13.7",
  "python-dotenv>=1.0", "snowballstemmer>=2.2", "matplotlib>=3.8", "mcp>=1.2", "playwright>=1.45"]

[project.scripts]
sf = "strategist.cli:main"
strategist-mcp = "strategist.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["strategist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
