# Рубрика оценки результата (критерий «Проработанность» хакатона, разложенный на проверяемые части).
# Используется субагентом jury, командой `sf eval judge` и людьми. Шкала 0–10 по каждому критерию.
criteria:
  - id: K1
    name: Проверяемость
    what: "Существенные утверждения связаны с конкретными источниками (ссылка, дата, цитата); можно проверить, откуда взята каждая цифра."
  - id: K2
    name: Факты отделены от гипотез и прогнозов
    what: "Явно видно, что известно, что предполагается, что прогнозируется; синтетика и мнения компаний не выдаются за факты."
  - id: K3
    name: Честные пробелы
    what: "Названо, чего не знаем, почему, как это влияет на решение и как узнать; противоречия источников разобраны."
  - id: K4
    name: Содержательно разные варианты
    what: "Не меньше трёх вариантов с разной логикой ценности, включая «оставить как есть» и «закрыть»; у каждого — сильные возражения."
  - id: K5
    name: Продуктовая стратегия
    what: "Аудитория и её задача, реальные альтернативы, выбранное направление, осознанные отказы, связь пользы с затратами и доходами."
  - id: K6
    name: Коммуникационная стратегия
    what: "Аудитория и ситуация, барьер, ключевое сообщение и его подтверждение, роль каналов, обещания соответствуют продукту."
  - id: K7
    name: План проверки
    what: "Ожидаемое изменение, с чем сравниваем, срок наблюдения, нежелательные последствия, критерии решения; дизайн реалистичен."
  - id: K8
    name: Пригодность для решения
    what: "Руководитель понимает, что делать завтра, сколько это стоит, кто отвечает и при каких условиях пересмотреть решение."
