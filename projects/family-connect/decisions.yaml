# Журнал решений проекта family-connect. Проверка: python sf.py -p family-connect decisions check
# Кварталы планового года отнесены к 2027 году (бриф год не называет) — уточнить с руководителем направления.
- id: D1
  title: 'Первыми — организаторы семейных групп: пилот сигнала о низком остатке у близкого (вариант B)'
  date: '2026-11-20'
  question: Кому помочь первым и что изменить первым, чтобы оператору было за что вкладывать деньги в плановом году?
  options_considered: [A, B, C, D, E, F]
  chosen: B — сигнал организатору до ограничения и переход к существующей передаче из свободного остатка, только с разрешения участника;
    пилот во II квартале, вариант E (владельцы нескольких номеров) — вторым шагом на том же механизме
  decided_by: руководитель направления (роль); выбор варианта — ворота G2, приёмка стратегии — ворота G3
  rationale_claims: [C008, C014, C015, C016, C025, C028, C029, C037, C038, C039, C040]
  assumptions: [C020, C021, C022, C023, C030, C031, C032, C033, C034, C035, C036, C041]
  owners:
    product: руководитель продукта семейных групп
    analytics: аналитик (половина ставки)
    design: дизайнер (половина ставки)
    billing: владелец системы расчётов
    security: безопасность
    support: руководитель поддержки
    finance: финансовая команда
    legal: юрист (согласие, доступ к сведениям, платежи — «проверить у юриста»)
  budget:
    development: 1,5–2,5 человеко-месяца из трёх, выделенных на II квартал (C015, C029)
    team: дизайнер и аналитик по половине ставки с I квартала; один человеко-месяц тестирования во II квартале (C015)
    max_investment_to_year3: от ≈0,95 до ≈6,5 млн руб. в зависимости от охвата и снижения оттока (C039)
  decision_rule: Шкала — абсолютная разница доли участников с ограничением за 7 дней после первого подходящего низкого остатка
    (ветка сигнала против обычного обслуживания, семья целиком, все включённые). Порог — снижение на 3 п.п. (C031), разброс при
    расчётном размере — половина ширины 95% интервала ≈2,1 п.п. (C040). Интервал целиком выше нуля и оценка не меньше порога →
    запуск на подходящие группы; интервал целиком ниже порога → масштабирование не оправдано; интервал включает и ноль, и порог →
    продлить набор, вывод «пользы нет» не делать. Любой повторный вычет или видимость остатка после отзыва согласия → остановка.
  metrics:
  - name: снижение доли ограничений, п.п. (сигнал против контроля)
    baseline: доля ограничений без сигнала 10–15% — допущение A6 (C030), уточняется выгрузкой K1
    target: оценка >= 3 п.п. и 95% интервал целиком выше нуля (C031, C040)
    by: '2027-09-30'
  - name: верхняя граница 95% интервала снижения доли ограничений, п.п.
    baseline: нет данных до пилота
    target: '>= 3'
    by: '2027-09-30'
  - name: доля случаев низкого остатка со свободным остатком в группе, %
    baseline: нет данных — выгрузка K1
    target: известна до решения о пилоте
    by: '2027-03-31'
  - name: повторные вычеты и списания, случаев
    baseline: '0'
    target: '0'
    by: '2027-06-30'
  - name: видимость остатка после отзыва согласия, случаев
    baseline: '0'
    target: '0'
    by: '2027-06-30'
  - name: доля активных среди подключённых групп, %
    baseline: 62,5 без изменений (C024)
    target: 66,5 в основном ходе (C033, C038)
    by: '2027-12-31'
  commitments:
  - id: K1
    what: 'Выгрузка за три месяца: случаи низкого остатка у участников, был ли свободный остаток в группе, ограничения с причиной
      (объём или неоплата), передачи — проверка допущений A6 и A8 (C030, C032)'
    owner: аналитик
    due: '2026-12-04'
    status: open
    depends_on: [K4]
  - id: K2
    what: Беседы с организаторами и участниками о последнем случае перебоя у близкого — по шагам восстановленного случая
    owner: руководитель продукта семейных групп
    due: '2026-12-04'
    status: open
  - id: K3
    what: Макет сигнала и проверка удобства — привычный и новый способ в чередующемся порядке; кто справился, ошибки, время
    owner: дизайнер
    due: '2026-12-18'
    status: open
    depends_on: [K4]
  - id: K4
    what: Выделить дизайнера и аналитика по половине ставки на подготовку в I квартале (C015)
    owner: руководитель направления
    due: '2026-12-04'
    status: open
  - id: K5
    what: Подтвердить статус операции до исполнения, защиту от повторного вычета (ключ операции) и ежедневную сверку
    owner: владелец системы расчётов
    due: '2027-03-31'
    status: open
  - id: K6
    what: Проверить разрешение «остаток», отзыв согласия и журнал доступа; правовые вопросы — у юриста
    owner: безопасность
    due: '2027-03-31'
    status: open
  - id: K7
    what: Решение об одобрении пилота, пороге 3 п.п. и правиле решения по интервалу (C031, C040)
    owner: руководитель направления
