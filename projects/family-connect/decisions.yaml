  - id: K8
    what: Решение по недостижимым целям планового года — финансировать ли отдельное направление подключения и активации или
      принять разрыв (C038)
    owner: руководитель направления и финансовая команда
    due: '2027-03-31'
    status: open
  - id: K9
    what: 'Итоги II квартала: понятность сигнала, исполнение передач без повторных вычетов, темп набора; выбор — охват, доработка,
      продление или остановка (C013, C037)'
    owner: руководитель продукта семейных групп
    due: '2027-06-30'
    status: open
    depends_on: [K7]
  - id: K10
    what: Оценка эффекта на долю ограничений по правилу интервала; сравнение простого сигнала и сигнала с экраном группы (C040)
    owner: аналитик
    due: '2027-09-30'
    status: open
    depends_on: [K9]
  review_triggers:
  - {type: date, value: '2026-12-04', note: 'Две недели: данные K1, беседы K2 — подтверждают ли приоритет'}
  - {type: date, value: '2027-03-31', note: 'Конец I квартала: решение о пилоте (K7) и о разрыве целей (K8)'}
  - {type: date, value: '2027-06-30', note: 'Конец II квартала: охват, доработка, продление или остановка (K9)'}
  - {type: date, value: '2027-09-30', note: 'Конец III квартала: эффект на ограничения (K10)'}
  - {type: claim_status, claim: C016, when: [retracted, disputed], note: 'Основание опровергнуто: помощь из свободного остатка недоступна или перебои не из-за доли'}
  - {type: claim_status, claim: C030, when: [retracted, disputed], note: 'Частота ограничений после низкого остатка другая — пересчитать размер пилота'}
  - {type: claim_status, claim: C032, when: [retracted, disputed], note: 'Темп набора другой — пересчитать срок пилота'}
  - {type: metric, metric: 'доля случаев низкого остатка со свободным остатком в группе, %', op: '<', threshold: 50, note: 'Свободного остатка обычно нет — сигнал вместе с покупкой или переход к варианту E'}
  - {type: metric, metric: 'повторные вычеты и списания, случаев', op: '>', threshold: 0, note: 'Kill: остановка операций, сверка, помощь поддержки'}
  - {type: metric, metric: 'видимость остатка после отзыва согласия, случаев', op: '>', threshold: 0, note: 'Kill: пилот на паузу до исправления'}
  - {type: metric, metric: 'верхняя граница 95% интервала снижения доли ограничений, п.п.', op: '<', threshold: 3, note: 'Масштабирование не оправдано — B не расширять'}
  status: active
