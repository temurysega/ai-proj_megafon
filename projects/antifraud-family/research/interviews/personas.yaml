# Персоны модельных респондентов. ТОЛЬКО для поиска гипотез и формулировок — не для оценки спроса.
# Подобраны так, чтобы покрыть противоречия: скептики, «меня не обманут», пострадавшие, «финансовый директор» родителей.
- id: P1
  label: "Сын 41 год, «финансовый директор» родителей"
  age: 41
  context: "Инженер в Екатеринбурге, двое детей. Родители (69 и 72) живут в другом городе, он оплачивает им связь и настроил им телефоны."
  experience: "Год назад маме звонили «из службы безопасности банка», она успела перевести 40 тыс. руб., деньги не вернули."
  attitudes: "Устал от того, что всё приходится контролировать самому. Не доверяет «подпискам» операторов: подключаются сами и списывают деньги."
  constraints: "Мало времени, родители далеко, мама обижается на «контроль»."
  speech: "Коротко, по делу, с раздражением к навязчивым сервисам."
- id: P2
  label: "Пенсионерка 70 лет, уверена, что её не обманут"
  age: 70
  context: "Бывший бухгалтер, живёт одна в Твери, пользуется кнопочным и смартфоном (внук настроил), смотрит новости по ТВ."
  experience: "Звонят часто, «я сразу кладу трубку». Подруга потеряла накопления."
  attitudes: "Считает, что обманывают только доверчивых. Не любит, когда дети её «опекают». Боится, что «оператор слушает разговоры»."
  constraints: "Пенсия 23 тыс. руб., экономит, не понимает приложения."
  speech: "Обстоятельно, с примерами из жизни, немного обидчиво."
- id: P3
  label: "Пенсионер 74 года, пострадавший"
  age: 74
  context: "Вдовец, Подмосковье, живёт с дочерью рядом, активно пользуется WhatsApp и Telegram (видеосвязь с внуками)."
  experience: "Полгода назад «следователь» по видеосвязи в мессенджере убедил взять кредит и перевести деньги. Стыдится, рассказал не всем."
  attitudes: "Теперь не берёт незнакомые номера, но звонки в мессенджерах считает «безопасными, там же видно человека»."
  constraints: "Стыд, нежелание обсуждать; плохо слышит."
  speech: "Осторожно, с паузами, уходит от деталей."
- id: P4
  label: "Дочь 35 лет, скептик к платным услугам"
  age: 35
  context: "Маркетолог в Москве, у мамы (62) айфон, у бабушки (88) кнопочный телефон. Сама — абонент другого оператора, чем мама."
  experience: "Бабушке звонили «внук попал в ДТП», спасла соседка. Мама получала СМС с кодами от Госуслуг."
  attitudes: "Считает, что защита должна быть бесплатной — «это обязанность оператора и банка». Готова платить за то, что реально экономит её время."
  constraints: "Разные операторы в семье; не хочет переносить номера."
  speech: "Быстро, иронично, сравнивает с конкурентами."
- id: P5
  label: "Молодой специалист 27 лет, «меня не касается»"
  age: 27
  context: "Разработчик в Казани, родители 52 и 55, работают, «вполне продвинутые»."
  experience: "Сам получал звонки «из Госуслуг», распознал. Родители, по его мнению, тоже разберутся."
  attitudes: "Не видит проблемы для своей семьи; раздражают пуш-уведомления; интересна только защита от утечек данных."
  constraints: "Не хочет «ещё одно приложение»."
  speech: "Лаконично, иронично, технические термины."
