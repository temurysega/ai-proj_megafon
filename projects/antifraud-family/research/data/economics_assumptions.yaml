# Допущения для порогов безубыточности. НЕ данные компании (C001): диапазоны выбраны как правдоподобные
# для мобильного оператора РФ и должны быть заменены внутренними данными при реальном решении.
# v2 (после красной команды): срок жизни подписки короче срока жизни домохозяйства; линии — только номера
# МегаФона (C050); добавлен порог для смешанного варианта C (часть платящих уходит на бесплатную базу).
family_price_rub: 249            # цена «Семейной безопасности +» за 30 дней (факт C050)
subscription_margin: 0.9         # маржинальность подписки (цифровой сервис, допущение)
subscription_churn: [0.05, 0.10] # месячный отток самой подписки (отключения), допущение — подписка живёт 10–20 мес.
marginal_cost_per_family_rub: 15 # предельные затраты на защиту семьи в месяц: SMS-уведомления, вычисления (допущение)
arpu_rub: [400, 550, 700]        # выручка на линию МегаФона в месяц, ₽ (допущение)
lines_per_household: [2, 3]      # линий МегаФона в защищённом домохозяйстве: владелец + 1–2 близких (ср. C034, только номера МегаФона — C050)
margin: [0.4, 0.55]              # маржинальная прибыль с выручки связи (допущение)
monthly_churn: [0.01, 0.015, 0.02, 0.025]  # месячный отток домохозяйства до изменения (допущение)
# Вариант C: доля платящих, ушедших на бесплатную базу, и сколько новых (ранее неплатящих) семей
# подключают бесплатную базу на одну платящую (допущения для сценариев)
c_downgrade_share: [0.2, 0.5]
c_new_free_per_payer: [2, 5, 10]
base:
  arpu_rub: 550
  lines_per_household: 2
  margin: 0.55
  monthly_churn: 0.015
  subscription_churn: 0.07
  c_downgrade_share: 0.3
  c_new_free_per_payer: 5
