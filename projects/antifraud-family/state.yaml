- id: Q1
  question: 'Что важнее при выборе модели продукта: удержание абонентов и доверие к бренду, прямая выручка от подписки
    или снижение потерь людей от мошенников?'
  why: 'Определяет критерий сравнения вариантов: при цели «выручка» бесплатная модель проигрывает, при цели «удержание»
    — может выиграть'
  default: удержание и доверие, при окупаемости затрат
  status: answered
  asked: '2026-11-14T11:36:38+03:00'
  answer: Удержание абонентов и доверие к бренду (при окупаемости затрат косвенным эффектом)
  answered: '2026-11-14T11:40:41+03:00'
- id: Q2
  question: Кто получатель результата и в каком формате?
  why: 'Определяет глубину и формат: one-pager для CPO или подробный отчёт для команды'
  default: руководитель продукта и CPO; one-pager + полный отчёт с источниками
  status: answered
  asked: '2026-11-14T11:36:39+03:00'
  answer: Руководитель продукта и CPO; one-pager + полный отчёт с источниками
  answered: '2026-11-14T11:40:42+03:00'
