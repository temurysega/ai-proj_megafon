project: antifraud-family
title: 'Семейная защита от телефонных мошенников: что делать с продуктом и как о нём говорить'
request: Базовую защиту от мошенников все операторы теперь дают бесплатно, и люди считают, что платить за неё не
  должны. Что нам делать с семейной защитой (уведомления близким, ИИ-ассистент, который отвечает на подозрительные
  звонки) — развивать как платную, сделать бесплатной ради удержания или свернуть? И что говорить людям, чтобы ей
  реально пользовались?
