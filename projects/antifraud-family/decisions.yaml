  decided_by: "руководитель продукта (роль), ворота G2"
  rationale_claims: [C050, C051, C054, C055, C068, C069, C071, C075]
  assumptions: [C001, C034, C056, C058, C060, C061, C062, C063, C064, C065, C067, C070, C076]
